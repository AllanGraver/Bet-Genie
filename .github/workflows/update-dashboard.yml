name: Opdater BetScope CSV-dashboard

on:
  workflow_dispatch:
    inputs:
      analysis_date:
        description: "Valgfri dato i formatet YYYY-MM-DD"
        required: false
        type: string

  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betscope-daily
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Byg data og deploy dashboard

    runs-on: ubuntu-latest

    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Hent repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Installér Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installér afhængigheder
        run: npm install

      - name: Kontrollér API-nøgle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::error::Repository secret API_FOOTBALL_KEY mangler."
            exit 1
          fi

      - name: Kør automatiske tests
        run: npm test

      - name: Fastlæg analysedato
        id: analysis
        env:
          INPUT_DATE: ${{ inputs.analysis_date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            if ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::Datoen skal skrives som YYYY-MM-DD."
              exit 1
            fi

            ANALYSIS_DATE="$INPUT_DATE"
          else
            ANALYSIS_DATE=$(TZ=Europe/Copenhagen date +%F)
          fi

          echo "date=$ANALYSIS_DATE" >> "$GITHUB_OUTPUT"
          echo "BetScope analyserer datoen: $ANALYSIS_DATE"

      - name: Hent fixtures, opdater CSV-hukommelse og byg dashboard
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANALYSIS_DATE: ${{ steps.analysis.outputs.date }}
        run: npm run build

      - name: Kontrollér genereret dashboarddata
        run: |
          test -f docs/data/results.json

          node -e "
            const fs = require('fs');
            const file = 'docs/data/results.json';
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));

            if (!Array.isArray(data.results)) {
              throw new Error('results mangler eller er ikke en liste');
            }

            if (!Array.isArray(data.nearMisses)) {
              throw new Error('nearMisses mangler eller er ikke en liste');
            }

            if (!Array.isArray(data.foundLeagues)) {
              throw new Error('foundLeagues mangler eller er ikke en liste');
            }

            console.log({
              date: data.date,
              totalMatches: data.totalMatches,
              approved: data.results.length,
              nearMisses: data.nearMisses.length,
              leagues: data.foundLeagues.length,
              requestsUsed: data.requestUsage?.used
            });
          "

      - name: Gem opdaterede CSV-filer og dashboarddata
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/leagues
          git add data/cache
          git add docs/data/results.json

          if git diff --cached --quiet; then
            echo "Ingen dataændringer at gemme."
          else
            git commit -m "Opdater BetScope-data ${{ steps.analysis.outputs.date }}"

            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Konfigurér GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
