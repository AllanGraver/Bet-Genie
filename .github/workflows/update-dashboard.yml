name: Opdater BetScope CSV-dashboard
on:
  workflow_dispatch:
    inputs:
      analysis_date:
        description: "Valgfri startdato i formatet YYYY-MM-DD"
        required: false
        type: string
  schedule:
    - cron: "15 6 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: betscope-daily
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Installér npm-afhængigheder
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Kør tests
        run: npm test
      - name: Fastlæg startdato
        id: analysis
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.analysis_date || '' }}
        run: |
          if [ -n "$INPUT_DATE" ]; then D="$INPUT_DATE"; else D=$(TZ=Europe/Copenhagen date +%F); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - name: Opret datamapper
        run: mkdir -p data/leagues data/cache/odds docs/data
      - name: Byg den eksisterende BetScope-analyse
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANALYSIS_DATE: ${{ steps.analysis.outputs.date }}
        run: npm run build:data
      - name: Tilføj Unibet-odds fra Odds-API.io
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node src/enrich-odds.js
      - name: Gem data og odds-cache
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leagues data/cache docs/data/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Opdater BetScope-data og Unibet-odds"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
