name: Opdater BetScope CSV-dashboard
on:
  workflow_dispatch:
    inputs:
      analysis_date:
        description: Valgfri dato i YYYY-MM-DD
        required: false
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: betscope-daily
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm test
      - name: Hent fixtures, opdater CSV-hukommelse og byg dashboard
        run: npm run build
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANALYSIS_DATE: ${{ inputs.analysis_date }}
      - name: Gem opdaterede CSV-filer og dashboarddata i repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leagues data/cache docs/data/results.json
          git diff --cached --quiet || git commit -m "Automatisk dataopdatering"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: docs}
      - id: deployment
        uses: actions/deploy-pages@v4
