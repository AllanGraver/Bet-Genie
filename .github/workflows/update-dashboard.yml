name: Opdater BetScope fra FBref CSV

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "docs/data/**/*.csv"
      - "src/**/*.js"
      - "test/**/*.js"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betscope-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Hent repository
        uses: actions/checkout@v6

      - name: Installer Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Vis Node-version
        run: |
          node --version
          npm --version

      - name: Kør tests
        run: npm test

      - name: Generér results.json fra CSV
        run: npm run build:data
        env:
          TIMEZONE: Europe/Copenhagen

      - name: Gem results.json i repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/results.json

          if git diff --cached --quiet; then
            echo "Ingen ændringer i results.json"
          else
            git commit -m "Opdater BetScope-resultater"
            git push
          fi

      - name: Konfigurér GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicér GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
